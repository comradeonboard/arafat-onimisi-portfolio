# Render Blueprint: Web Service for the portfolio.
# No dependencies: the build step copies the site into dist/, and server.py
# serves that folder on the port Render provides.
services:
  - type: web
    name: arafat-onimisi-portfolio
    runtime: python
    plan: free
    repo: https://github.com/comradeonboard/arafat-onimisi-portfolio
    branch: main
    buildCommand: mkdir -p dist && cp -r *.html *.xml *.txt favicon.ico assets dist/
    startCommand: python3 server.py
    autoDeployTrigger: commit
